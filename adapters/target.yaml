row: 
    map:
        column: id
        to_subject: gene

transformers:
    - split_nested:
        keys:
            - proteinIds
            - id
        to_object: protein
        via_relation: transcribed_to
    - split_nested:
        keys:
            - proteinIds
            - source
        to_property: id_source
        for_object: protein
