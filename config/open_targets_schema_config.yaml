drug:
    # is_a: drug 
    represented_as: node
    label_in_input : drug
    properties:
        canonicalSmiles: str
        inchiKey: str
        drugType: str
        blackBoxWarning: bool
        drug_name: str
        yearOfFirstapproval: str
        maximumClinicalTrialPhase: str
        hasBeenWithdrawn: bool
        isApproved: bool
        tradeName: str
        synonym: str
        references: str
        description: str
        data_source: str
        
gene:
    represented_as: node
    label_in_input: gene
    properties:
        gene_summary: str
        hugoSymbol: str
        name: str
        data_source: str

protein:
    represented_as: node
    label_in_input: protein
    properties:
        data_source: str

