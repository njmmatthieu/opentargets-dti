# NODES

row_drug:
    is_a: drug 
    represented_as: node
    label_in_input : row_drug
    properties:
        canonicalSmiles: str
        inchiKey: str
        drugType: str
        blackBoxWarning: bool
        drug_name: str
        yearOfFirstapproval: str
        maximumClinicalTrialPhase: str
        hasBeenWithdrawn: bool
        isApproved: bool
        tradeName: str
        synonym: str
        references: str
        description: str
        data_source: str

